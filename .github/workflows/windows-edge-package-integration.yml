name: Windows Edge packaged synthetic integration

on:
  push:
    branches: [codex/edge-wns-production-20261111]
    paths:
      - .github/workflows/windows-edge-package-integration.yml
      - scripts/native-test/edge-hosted-package-integration.ps1
      - scripts/native-test/edge-hosted-package-integration.test.cjs
      - scripts/native-test/edge-hosted-node-selection.ps1
      - scripts/native-test/edge-hosted-node-selection.test.cjs
      - scripts/native-test/edge-hosted-probe-mode.ps1
      - scripts/native-test/edge-hosted-probe-mode.test.cjs
      - scripts/native-test/edge-synthetic-restart-child.test.cjs
      - scripts/native-test/edge-fixture-frame-count.test.cjs
      - scripts/native-test/edge-fixture-send-status.test.cjs
      - scripts/test/edge-calibration-cleanup-race.test.js
      - scripts/native-test/edge-fixture-archive.test.cjs
      - experiments/chrome-push/edge-fixture-archive.cjs
      - experiments/chrome-push/edge-broker-pipe-probe.cjs
      - experiments/chrome-push/edge-synthetic-restart-child.cjs
      - experiments/chrome-push/edge-fixture-frame-count.cjs
      - experiments/chrome-push/edge-fixture-send-status.cjs
      - scripts/fixtures/edge-cdp-deps/package.json
      - scripts/fixtures/edge-cdp-deps/package-lock.json
      - scripts/build-edge-setup-package.cjs
      - client/angelic-setup/Edge*.ps1
      - src/automation/edge-*.js
      - package-lock.json

permissions:
  contents: read

jobs:
  packaged-edge:
    runs-on: windows-2025
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, online-batch, offline-batch, offline-status, offline-cache, offline-no-cache]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - name: Install pinned dependencies without lifecycle scripts
        shell: pwsh
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
          npm ci --prefix packages/angelic-angel --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Decryptor dependency installation failed' }
          npm ci --prefix scripts/fixtures/edge-cdp-deps --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic browser dependency installation failed' }
          npm --prefix packages/angelic-angel run build
          if ($LASTEXITCODE -ne 0) { throw 'Decryptor build failed' }
      - name: Verify immutable package reader
        shell: pwsh
        run: |
          node --test scripts/native-test/edge-fixture-archive.test.cjs scripts/native-test/edge-hosted-package-integration.test.cjs scripts/native-test/edge-hosted-node-selection.test.cjs scripts/native-test/edge-hosted-probe-mode.test.cjs scripts/native-test/edge-synthetic-restart-child.test.cjs scripts/native-test/edge-fixture-frame-count.test.cjs scripts/native-test/edge-fixture-send-status.test.cjs scripts/test/edge-calibration-cleanup-race.test.js
          if ($LASTEXITCODE -ne 0) { throw 'Pinned package test failed' }
      - name: Build exact preview candidate in runner temp
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'cbte-edge-preview-18.zip'
          node scripts/build-edge-setup-package.cjs --output $output
          if ($LASTEXITCODE -ne 0) { throw 'Preview build failed' }
          if ((Get-FileHash -LiteralPath $output -Algorithm SHA256).Hash -ine 'a8f75fb017725e50515c141ffe5bac142540e7fd0e8364da0d6f5fd2f0129013') { throw 'Preview hash mismatch' }
      - name: Run signed Edge, packaged export, isolated DB and WNS
        shell: powershell
        run: |
          & ./scripts/native-test/edge-hosted-package-integration.ps1 -Mode '${{ matrix.mode }}'
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic integration failed' }
