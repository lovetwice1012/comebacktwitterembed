name: macOS Edge synthetic receive suppression
on:
  push:
    branches: [codex/edge-wns-production-20261111]
    paths:
      - .github/workflows/mac-edge-suppression.yml
      - scripts/native-test/edge-mac-suppression-*.cjs
      - scripts/test/edge-mac-suppression-errors.test.js
      - src/automation/edge-private-broker.js
      - src/automation/edge-cdp-pipe.js
      - src/automation/edge-mac-*.js
      - src/automation/edge-wns-*.js
      - src/automation/edge-calibration-*.js
      - package-lock.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install Edge on the disposable runner
        run: |
          test "${GITHUB_ACTIONS:-}" = true
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted
          if [ ! -x '/Applications/Microsoft Edge.app/Contents/MacOS/Microsoft Edge' ]; then
            brew install --cask --no-quarantine microsoft-edge
          fi
          sudo xattr -cr '/Applications/Microsoft Edge.app'
      - name: Install locked test dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix packages/angelic-angel --ignore-scripts --no-audit --no-fund
          npm --prefix packages/angelic-angel run build
      - name: Build isolated peer helpers
        run: |
          clang -O2 client/angelic-setup/mac/edge-process-identity.c -o "$RUNNER_TEMP/MacEdgeIdentity"
          clang -O2 client/angelic-setup/mac/edge-socket-owner.c -o "$RUNNER_TEMP/MacEdgeSocketOwner"
      - name: Test synthetic browser and receiver
        env:
          CBTE_MAC_EDGE_HOSTED: '1'
          MAC_EDGE_IDENTITY_HELPER: ${{ runner.temp }}/MacEdgeIdentity
          MAC_EDGE_SOCKET_HELPER: ${{ runner.temp }}/MacEdgeSocketOwner
        run: node --test scripts/test/edge-mac-suppression-errors.test.js scripts/native-test/edge-mac-suppression-hosted.test.cjs
