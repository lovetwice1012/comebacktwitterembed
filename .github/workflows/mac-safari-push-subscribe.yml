name: macOS Safari synthetic push subscription

on:
  workflow_dispatch:
  push:
    branches: [codex/edge-wns-production-20261111]
    paths:
      - .github/workflows/mac-safari-push-subscribe.yml
      - scripts/native-test/safari-hosted-push-subscribe.test.cjs
      - scripts/native-test/safari-hosted-ax-probe.swift

permissions:
  contents: read

jobs:
  safari-subscription:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
        fixture_host: ['127.0.0.1', 'localhost']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      # The only system setting change is on the disposable hosted runner.
      - name: Enable Safari WebDriver on hosted macOS
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_ACTIONS:-}" = true
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted
          test "$(uname -s)" = Darwin
          test -x /usr/bin/safaridriver
          sudo /usr/bin/safaridriver --enable
      - name: Attempt one synthetic subscription, without sending a notification
        env:
          CBTE_SAFARI_PUSH_HOSTED: '1'
          CBTE_SAFARI_SYNTHETIC_ALLOW: '1'
          CBTE_SAFARI_FIXTURE_HOST: ${{ matrix.fixture_host }}
        run: node --test scripts/native-test/safari-hosted-push-subscribe.test.cjs
