[package]
name = "angelic-angel-compat-oracle"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "angelic-angel-rust-oracle"
path = "src/main.rs"

[[bin]]
name = "angelic-angel-rust-baseline"
path = "../legacy-rust/src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
base64 = "0.22"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"
uuid = { version = "1", features = ["v4"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
p256 = { version = "0.13", features = ["ecdh"] }
rand = "0.8"
futures-util = "0.3"
ece = "=2.3.1"
# Build-only portability: preserves ECE's original OpenSSL backend without
# requiring a system OpenSSL install on the comparison host.
openssl = { version = "0.10", features = ["vendored"] }
socket2 = "0.5"
console = "0.15"
dialoguer = "0.11"
indicatif = "0.17"
