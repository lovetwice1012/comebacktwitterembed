# Keep the existing Cloudflare Tunnel origin at port 30987.
# The regular Next.js dashboard moves to 30989; /ops remains available
# independently of the Bot and the dashboard process.
server {
    listen 30987;
    listen [::]:30987;
    server_name _;
    client_max_body_size 40m;
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header CF-Connecting-IP;

    location = /ops {
        return 308 /ops/;
    }

    location /ops/ {
        proxy_pass http://127.0.0.1:30988/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Prefix /ops;
        proxy_set_header X-Forwarded-For $remote_addr;
        # These credentials belong exclusively to the local trusted proxy.
        proxy_set_header X-Admin-Agent-Token "";
        proxy_set_header X-Admin-Actor "";
        proxy_buffering off;
        proxy_read_timeout 90s;
    }

    location / {
        proxy_pass http://127.0.0.1:30989;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90s;
    }
}
