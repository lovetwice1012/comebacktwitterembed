# These origins are reachable only through the dedicated Cloudflare connector.
server {
    listen 127.0.0.1:30986;
    server_name cbte-recovery.sprink.cloud;
    client_max_body_size 40m;
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;
    location = / { return 302 /ops/; }
    location = /ops { return 308 /ops/; }
    location /ops/ {
        proxy_pass http://127.0.0.1:30988/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Prefix /ops;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Admin-Agent-Token "";
        proxy_set_header X-Admin-Actor "";
        proxy_buffering off;
        proxy_read_timeout 90s;
    }
    location / { return 404; }
}

server {
    listen 127.0.0.1:30987;
    server_name cbte.sprink.cloud;
    client_max_body_size 40m;
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;
    # The independent OAuth cookie and callback belong to the emergency origin.
    location = /ops { return 308 https://cbte-recovery.sprink.cloud/ops/; }
    location /ops/ { return 308 https://cbte-recovery.sprink.cloud$request_uri; }
    location / {
        proxy_pass http://127.0.0.1:30989;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90s;
    }
}

server {
    listen 127.0.0.1:30985;
    server_name twidata.sprink.cloud;
    location = /api/health {
        proxy_pass http://127.0.0.1:30989/api/health;
        proxy_set_header Host cbte.sprink.cloud;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "no-store" always;
    }
    location ~ (^|/)\. { deny all; }
    location /data/ {
        alias /var/lib/cbte-recovery/public-saves-current/;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
    }
    location / { return 404; }
}
