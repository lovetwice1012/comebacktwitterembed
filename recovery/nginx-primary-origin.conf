# Primary Tunnel uses port 30987; the guarded dashboard and local health use 30989.
# Install in /etc/nginx/conf.d/, validate with nginx -t, then reload nginx.
map $http_upgrade $cbte_upgrade_connection {
    default upgrade;
    '' close;
}
map $http_x_forwarded_proto $cbte_forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
}
server {
    listen 127.0.0.1:30987;
    listen [::1]:30987;
    server_name cbte.sprink.cloud twidata.sprink.cloud;
    client_max_body_size 100m;
    location / {
        proxy_pass http://127.0.0.1:30989;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $cbte_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $cbte_upgrade_connection;
        proxy_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}
